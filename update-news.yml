name: Update IAM news

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect latest IAM news
        run: python scripts/update_news.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/all_articles.json data/archive/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update weekly IAM news and archive"
            git push
          fi
